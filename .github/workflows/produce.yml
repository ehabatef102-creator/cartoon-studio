name: produce-episode

on:
  workflow_dispatch:
    inputs:
      story:
        description: "الفكرة / قصة الحلقة (اتركها فارغة لاستخدام سلسلة جاهزة)"
        required: false
        type: string
        default: ""
      characters:
        description: "الشخصيات — سطر لكل شخصية: الاسم | الدور | الوصف البصري | الصوت"
        required: false
        type: string
        default: ""
      events:
        description: "الأحداث / نقاط الحبكة (يوجه المخرج)"
        required: false
        type: string
        default: ""
      index:
        description: "سلسلة جاهزة من المكتبة (تُستخدم لو القصة فارغة)"
        required: false
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      video:
        description: "توليد فيديو المونتاج النهائي"
        required: false
        type: boolean
        default: true
      music:
        description: "موسيقى تصويرية + مؤثرات صوتية"
        required: false
        type: boolean
        default: true
      motion:
        description: "حركة كاميرا سينمائية"
        required: false
        type: boolean
        default: true
      motion_poses:
        description: "توليد pose حركة إضافية للمشاهد النشطة ودمجها (أ + ب) — أبطأ، حركة كرتونية أقوى"
        required: false
        type: boolean
        default: false
      comfy_url:
        description: "رابط خادم ComfyUI (من notebooks/ComfyUI_Cloud.ipynb) — اتركه فارغًا للـ Pollinations المجاني"
        required: false
        type: string
        default: ""
      comfy_ckpt:
        description: "اسم checkpoint في ComfyUI (اختياري — يُكتشف تلقائيًا)"
        required: false
        type: string
        default: ""
      comfy_steps:
        description: "خطوات KSampler (جودة أعلى = أبطأ)"
        required: false
        type: string
        default: "32"
      duration:
        description: "مدة الحلقة بالدقائق (مثلاً 2 للاختبار السريع، 25 للحلقة الكاملة — فارغ = حسب المخرج)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare story file
        env:
          STORY: ${{ github.event.inputs.story }}
          CHARS: ${{ github.event.inputs.characters }}
          EVENTS: ${{ github.event.inputs.events }}
        run: |
          mkdir -p work
          if [ -n "$STORY" ]; then
            printf '%s' "$STORY" > work/story.txt
          fi
          if [ -n "$CHARS" ]; then
            printf '%s' "$CHARS" > work/chars.txt
          fi
          if [ -n "$EVENTS" ]; then
            printf '%s' "$EVENTS" > work/events.txt
          fi

      - name: Run production on cloud
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          IMAGE_PROVIDER: ${{ github.event.inputs.comfy_url != '' && 'comfy' || 'auto' }}
          COMFY_URL: ${{ github.event.inputs.comfy_url }}
          COMFY_CKPT: ${{ github.event.inputs.comfy_ckpt }}
          COMFY_STEPS: ${{ github.event.inputs.comfy_steps }}
          IDX: ${{ github.event.inputs.index }}
          VIDEO: ${{ fromJSON(github.event.inputs.video) && '--video' || '' }}
          MUSIC: ${{ fromJSON(github.event.inputs.music) && '--music' || '' }}
          MOTION: ${{ fromJSON(github.event.inputs.motion) && '--motion' || '' }}
          MOTION_POSES: ${{ fromJSON(github.event.inputs.motion_poses) && '1' || '0' }}
          STORY_FILE: ${{ github.event.inputs.story != '' && 'work/story.txt' || '' }}
          CHARS_FILE: ${{ github.event.inputs.characters != '' && 'work/chars.txt' || '' }}
          EVENTS_FILE: ${{ github.event.inputs.events != '' && 'work/events.txt' || '' }}
          DURATION_MIN: ${{ github.event.inputs.duration }}
        run: |
          export TARGET_SECONDS=""
          if [ -n "$DURATION_MIN" ] && [ "$DURATION_MIN" -gt 0 ] 2>/dev/null; then
            export TARGET_SECONDS=$((DURATION_MIN * 60))
          fi
          python scripts/produce.py \
            ${IDX:+--index $IDX} \
            ${TARGET_SECONDS:+--target-seconds "$TARGET_SECONDS"} \
            ${VIDEO:+$VIDEO} \
            ${MUSIC:+$MUSIC} \
            ${MOTION:+$MOTION} \
            ${STORY_FILE:+--story-file "$STORY_FILE"} \
            ${CHARS_FILE:+--characters-file "$CHARS_FILE"} \
            ${EVENTS_FILE:+--events-file "$EVENTS_FILE"} \
            --out output

      - name: Upload episode ZIP
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: output/*.zip
          retention-days: 90
