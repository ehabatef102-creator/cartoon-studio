services:
  - type: web
    name: cartoon-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_VOICE
        value: ar-EG-SalmaNeural
      - key: IMAGE_PROVIDER
        value: auto
      - key: STABILITY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AUDIO_DESIGN
        value: "1"
      - key: MOTION_ENGINE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.3
